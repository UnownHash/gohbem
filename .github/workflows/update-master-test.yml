name: Update master-test and Run Tests

on:
  schedule:
    - cron: '0 0 * * *' # daily at 00:00 UTC
  workflow_dispatch: {}

jobs:
  update-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Fetch latest masterfile
        run: |
          curl -fsSL -o test/master-test.json 'https://raw.githubusercontent.com/WatWowMap/Masterfile-Generator/refs/heads/master/master-latest-basics.json'

      - name: Run go tests
        run: |
          go test ./... -v
